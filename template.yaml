AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  jmap-triage: polls Inbox/Triage, classifies with a GreenPT model (see
  classify.ts), moves mail, and notifies via Pushover. See ARCHITECTURE.md
  for the full design, DECISIONS.md for why GreenPT.

Parameters:
  GreenptModelId:
    Type: String
    Default: glm-5.3-flash
    Description: >
      Model id classify.ts calls against api.greenpt.ai. Verify against GET
      https://api.greenpt.ai/v1/models before changing -- a plan restriction
      can hide a model the key cannot actually invoke. Pacing for a new model
      belongs in model-pacing.ts, measured. See DECISIONS.md.
  GreenptApiKeyParam:
    Type: String
    Default: /jmap-triage/greenpt-api-key
    Description: >
      Name (not value) of the SecureString SSM parameter holding the GreenPT
      API key (greenpt.com, API-only account -- no monthly fee). Created out
      of band, same as FastmailTokenParam.
  TriageMailboxId:
    Type: String
    Description: Inbox/Triage mailbox id (source).
  InboxMailboxId:
    Type: String
    Description: Inbox mailbox id (destination for inbox).
  InboxOrdersMailboxId:
    Type: String
    Description: Inbox/Orders mailbox id (destination for orders).
  InboxNewsMailboxId:
    Type: String
    Description: Inbox/News mailbox id (destination for newsletters).
  ArchiveNoiseMailboxId:
    Type: String
    Description: Archive/Noise mailbox id (destination for noise).
  InboxSuspiciousMailboxId:
    Type: String
    Description: Inbox/Suspicious mailbox id (destination for suspicious).
  FastmailTokenParam:
    Type: String
    Default: /jmap-triage/fastmail-token
    Description: >
      Name (not value) of the SecureString SSM parameter holding the
      Fastmail API token. Create it out of band -- see README.md's Lambda
      deployment section.
  PushoverTokenParam:
    Type: String
    Default: /jmap-triage/pushover-token
  PushoverUserParam:
    Type: String
    Default: /jmap-triage/pushover-user
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
  ScheduleEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Leave "false" for the first deploy -- validate with a dry-run
      `aws lambda invoke` (README's Lambda deployment section) before
      redeploying with this set to "true" and going live on the schedule.
      Gates the EventBridge rule's existence via a Condition (below), not
      via the Schedule event's own `Enabled` property -- SAM's transform
      hardcodes that property's resulting `State` to ENABLED regardless of
      a Ref'd parameter, evaluating it at transform time before parameters
      are resolved.
  Limit:
    Type: Number
    Default: 10
    Description: >
      Max messages fetched from Inbox/Triage per invocation. Each message
      costs two model calls (round 1 phishing filter, then round 2 category
      triage), so 10 is 20 calls -- two waves at the classifier's concurrency,
      which fits the 240s Timeout even on the provider's slow days. Raising
      this means re-checking that budget; see DECISIONS.md.
  McpBearerTokenParam:
    Type: String
    Default: /jmap-triage/mcp-bearer-token
    Description: >
      Name (not value) of the SecureString SSM parameter holding the
      static bearer token jmap-triage-mcp's Streamable HTTP transport
      checks incoming requests against. Create it out of band, same as
      FastmailTokenParam. Currently unused -- see mcp-server.ts's
      bearerConfigured() -- kept as a parameter so enabling it later is a
      one-line env var addition, not a template change.
  LambdaWebAdapterLayerArn:
    Type: String
    Description: >
      ARN of the current AWS Lambda Web Adapter layer for this region/arch
      -- McpServerFunction runs as a plain Node http server (src/mcp-server.ts)
      fronted by this layer rather than a hand-rolled Streamable-HTTP-to-
      Lambda-event adapter. No default: look up the current published ARN
      for this region at deploy time (awslabs/aws-lambda-web-adapter) rather
      than trusting a value baked into this template, which could be stale.

Conditions:
  ScheduleIsEnabled: !Equals [!Ref ScheduleEnabled, "true"]

Resources:
  # current.json / history/* -- the source of truth for the classification
  # prompt (ARCHITECTURE.md). TriageFunction only reads current.json;
  # McpServerFunction reads and writes everything here. Versioning is on as
  # the undo path for a bad approve_prompt_diff, which has none of its own.
  PromptStoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TriageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - src/lambda.ts
    Properties:
      Handler: src/lambda.handler
      Runtime: nodejs24.x
      Timeout: 240
      MemorySize: 512
      # No ReservedConcurrentExecutions: this account's concurrency limit is
      # 10, and AWS requires >=10 to remain unreserved account-wide, so
      # reserving even 1 is rejected at deploy time. Revisit if that is
      # raised (ARCHITECTURE.md covers why overlap is tolerable meanwhile).
      Environment:
        Variables:
          GREENPT_MODEL_ID: !Ref GreenptModelId
          GREENPT_API_KEY_PARAM: !Ref GreenptApiKeyParam
          TRIAGE_MAILBOX_ID: !Ref TriageMailboxId
          INBOX_MAILBOX_ID: !Ref InboxMailboxId
          INBOX_ORDERS_MAILBOX_ID: !Ref InboxOrdersMailboxId
          INBOX_NEWS_MAILBOX_ID: !Ref InboxNewsMailboxId
          ARCHIVE_NOISE_MAILBOX_ID: !Ref ArchiveNoiseMailboxId
          INBOX_SUSPICIOUS_MAILBOX_ID: !Ref InboxSuspiciousMailboxId
          LIMIT: !Ref Limit
          FASTMAIL_TOKEN_PARAM: !Ref FastmailTokenParam
          PUSHOVER_TOKEN_PARAM: !Ref PushoverTokenParam
          PUSHOVER_USER_PARAM: !Ref PushoverUserParam
          PROMPT_BUCKET: !Ref PromptStoreBucket
      Policies:
        - Statement:
            - Sid: ReadLivePrompt
              Effect: Allow
              Action: s3:GetObject
              # Read-only on each round's live pointer: this function never
              # touches history/* and never approves a version. Two keys
              # because triage runs in two rounds, each with its own prompt
              # and version line (stages.ts).
              Resource:
                - !Sub "${PromptStoreBucket.Arn}/current.json"
                - !Sub "${PromptStoreBucket.Arn}/phish/current.json"
            - Sid: ReadTriageSecrets
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              # The *Param parameters already include their leading "/", so
              # this is "parameter${name}", not "parameter/${name}".
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FastmailTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PushoverTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PushoverUserParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GreenptApiKeyParam}

  # Raw CloudFormation, not SAM's `Events: Schedule:` shorthand: that
  # shorthand's schema allows no Condition key, so it can't be gated by
  # ScheduleEnabled at all. With a resource-level Condition here,
  # ScheduleEnabled=false leaves neither this rule nor its invoke permission
  # in the stack.
  TriageSchedule:
    Type: AWS::Events::Rule
    Condition: ScheduleIsEnabled
    Properties:
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt TriageFunction.Arn
          Id: TriageFunctionScheduleTarget

  TriageScheduleInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: ScheduleIsEnabled
    Properties:
      FunctionName: !Ref TriageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TriageSchedule.Arn

  # jmap-triage-mcp: the 5-tool review server (ARCHITECTURE.md), remote and
  # publicly reachable rather than local stdio. A plain Node http server, not
  # a hand-rolled Streamable-HTTP-to-Lambda-event adapter: the Lambda Web
  # Adapter layer execs it and proxies the Function URL's streamed HTTP
  # straight through, so mcp-server.ts stays Lambda-agnostic.
  McpServerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # NOT esbuild: SAM's built-in builder packages the bundle alone, and
      # the Lambda Web Adapter's zip convention needs a run.sh startup script
      # alongside it (Handler: run.sh, below). The root Makefile does both.
      # Pattern verified against awslabs/aws-lambda-web-adapter's
      # fastmcp-zip example.
      BuildMethod: makefile
    Properties:
      # Execed directly (AWS_LAMBDA_EXEC_WRAPPER below replaces Lambda's
      # normal handler dispatch); run.sh starts the long-lived node process
      # the adapter proxies to.
      Handler: run.sh
      Runtime: nodejs24.x
      # A generous ceiling, not the binding constraint: Claude Desktop's hard
      # 240s timeout on remote MCP tool calls is, and evaluate.ts's
      # counterweight caps and category scoping are the actual latency fix.
      # (Lambda's own max is 900s; RESPONSE_STREAM supports the full range,
      # unlike buffered mode's 30s cap.)
      Timeout: 600
      MemorySize: 512
      Layers:
        - !Ref LambdaWebAdapterLayerArn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          # Lowercase, adapter-specific -- NOT the casing of the Function
          # URL's own InvokeMode below. Per the adapter's README env table.
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
          PROMPT_BUCKET: !Ref PromptStoreBucket
          GREENPT_MODEL_ID: !Ref GreenptModelId
          GREENPT_API_KEY_PARAM: !Ref GreenptApiKeyParam
          FASTMAIL_TOKEN_PARAM: !Ref FastmailTokenParam
          # MCP_BEARER_TOKEN_PARAM deliberately NOT set -- the server runs
          # open, see README.md and mcp-server.ts's bearerConfigured(). The
          # SSM parameter, this function's read permission on it and the
          # McpBearerTokenParam template parameter all stay, so re-enabling
          # is one env var plus a redeploy rather than an IAM change.
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      Policies:
        - Statement:
            - Sid: ReadWritePromptStore
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              # The one role allowed to write current.json and history/*:
              # approve_prompt_diff is the system's only write path, and it
              # runs here.
              Resource: !Sub "${PromptStoreBucket.Arn}/*"
            - Sid: ListPromptStore
              Effect: Allow
              Action: s3:ListBucket
              # Without ListBucket, S3 answers GetObject on a missing key
              # with 403 AccessDenied rather than 404 NoSuchKey -- and
              # history.ts/approve.ts both key their "empty, not an error"
              # handling of a missing history/index.json on NoSuchKey
              # specifically. Scoped to the bucket, not its objects.
              Resource: !GetAtt PromptStoreBucket.Arn
            - Sid: ReadMcpSecrets
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FastmailTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${McpBearerTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GreenptApiKeyParam}

Outputs:
  TriageFunctionArn:
    Value: !GetAtt TriageFunction.Arn
  PromptStoreBucketName:
    Value: !Ref PromptStoreBucket
  McpServerFunctionUrl:
    Description: >
      Streamable HTTP endpoint for the jmap-triage-mcp custom connector --
      append /mcp (e.g. https://<id>.lambda-url.<region>.on.aws/mcp).
    Value: !GetAtt McpServerFunctionUrl.FunctionUrl
