AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  jmap-triage: polls Inbox/Triage, classifies with a Bedrock, Mistral or
  GreenPT model (chosen by the ModelProvider parameter -- see classify.ts), moves
  mail, and notifies via Pushover. See ARCHITECTURE.md for the full
  design.

Parameters:
  ModelProvider:
    Type: String
    Default: bedrock
    AllowedValues: ["bedrock", "mistral", "greenpt"]
    Description: >
      Which of classify.ts's three classifier backends TriageFunction and
      McpServerFunction (the evaluate_candidate replay) use. Defaults to
      "bedrock" so a plain redeploy without new parameter_overrides can't
      accidentally start depending on provider secrets that were never
      created. Switching is the whole cutover -- no code change, no other
      parameter is required to change with it.
  BedrockModelId:
    Type: String
    Description: >
      Bedrock model id (on-demand id or cross-region inference profile id)
      for eu-central-1 that classify.ts's Converse-based invokeBedrock calls
      -- see README.md prereq 3. Not hardcoded because both which model is
      chosen and Bedrock model ids in general change over time. Still
      required even when ModelProvider=mistral (CloudFormation parameters
      without a Default are always required) -- keeping a real value here is
      what makes switching back to ModelProvider=bedrock a config-only
      rollback with no redeploy-time surprises.
  MistralModelId:
    Type: String
    Default: mistral-medium-latest
    Description: >
      Model id classify.ts's invokeMistral calls directly against
      api.mistral.ai (not Bedrock) when ModelProvider=mistral. Not every
      model name Mistral documents is available on every account's
      subscription tier -- mistral-large-latest returned 403
      tier_not_allowed on this account when checked directly; verify with a
      real API call before changing this, don't assume from the model list
      endpoint alone (it lists models the tier can't actually invoke).
  MistralApiKeyParam:
    Type: String
    Default: /jmap-triage/mistral-api-key
    Description: >
      Name (not value) of the SecureString SSM parameter holding the
      Mistral API key (console.mistral.ai). Only fetched at runtime when
      ModelProvider=mistral -- create it out of band, same as
      FastmailTokenParam, before switching ModelProvider to "mistral".
  GreenptModelId:
    Type: String
    Default: glm-5.3-flash
    Description: >
      Model id classify.ts's invokeOpenAICompatible calls against
      api.greenpt.ai (not Bedrock) when ModelProvider=greenpt. Verify against
      GET https://api.greenpt.ai/v1/models before changing -- a plan
      restriction can hide a model the key cannot actually invoke, which is
      how Mistral's 403 tier_not_allowed went unnoticed. glm-5.3-flash was
      measured on the 36-case golden set at 35-36/36 category and 30-31/36
      notify, at or above the qwen3-235b-a22b Bedrock baseline it replaced.
  GreenptApiKeyParam:
    Type: String
    Default: /jmap-triage/greenpt-api-key
    Description: >
      Name (not value) of the SecureString SSM parameter holding the GreenPT
      API key (greenpt.com, API-only account -- no monthly fee). Only fetched
      at runtime when ModelProvider=greenpt -- create it out of band, same as
      FastmailTokenParam, before switching ModelProvider to "greenpt".
  TriageMailboxId:
    Type: String
    Description: Inbox/Triage mailbox id (source).
  InboxMailboxId:
    Type: String
    Description: Inbox mailbox id (destination for inbox).
  InboxOrdersMailboxId:
    Type: String
    Description: Inbox/Orders mailbox id (destination for orders).
  InboxNewsMailboxId:
    Type: String
    Description: Inbox/News mailbox id (destination for newsletters).
  ArchiveNoiseMailboxId:
    Type: String
    Description: Archive/Noise mailbox id (destination for noise).
  InboxSuspiciousMailboxId:
    Type: String
    Description: Inbox/Suspicious mailbox id (destination for suspicious).
  FastmailTokenParam:
    Type: String
    Default: /jmap-triage/fastmail-token
    Description: >
      Name (not value) of the SecureString SSM parameter holding the
      Fastmail API token. Create it out of band -- see README.md's Lambda
      deployment section.
  PushoverTokenParam:
    Type: String
    Default: /jmap-triage/pushover-token
  PushoverUserParam:
    Type: String
    Default: /jmap-triage/pushover-user
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
  ScheduleEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Leave "false" for the first deploy -- validate with a dry-run
      `aws lambda invoke` (README's Lambda deployment section) before
      redeploying with this set to "true" and going live on the schedule.
      Gates the EventBridge rule's existence via a Condition (below), not
      via the Schedule event's own `Enabled` property -- SAM's transform
      hardcodes that property's resulting `State` to ENABLED regardless of
      a Ref'd parameter, evaluating it at transform time before parameters
      are resolved.
  Limit:
    Type: Number
    Default: 20
    Description: Max messages fetched from Inbox/Triage per invocation.
  McpBearerTokenParam:
    Type: String
    Default: /jmap-triage/mcp-bearer-token
    Description: >
      Name (not value) of the SecureString SSM parameter holding the
      static bearer token jmap-triage-mcp's Streamable HTTP transport
      checks incoming requests against. Create it out of band, same as
      FastmailTokenParam. Currently unused -- see mcp-server.ts's
      bearerConfigured() -- kept as a parameter so enabling it later is a
      one-line env var addition, not a template change.
  LambdaWebAdapterLayerArn:
    Type: String
    Description: >
      ARN of the current AWS Lambda Web Adapter layer for this region/arch
      -- McpServerFunction runs as a plain Node http server (src/mcp-server.ts)
      fronted by this layer rather than a hand-rolled Streamable-HTTP-to-
      Lambda-event adapter. No default: look up the current published ARN
      for this region at deploy time (awslabs/aws-lambda-web-adapter) rather
      than trusting a value baked into this template, which could be stale.

Conditions:
  ScheduleIsEnabled: !Equals [!Ref ScheduleEnabled, "true"]

Resources:
  # current.json / history/* -- the S3-backed source of truth for the
  # classification prompt (see ARCHITECTURE.md). TriageFunction only
  # reads current.json (cold-start fetch -- a failed fetch is fatal, there
  # is no local fallback); McpServerFunction reads and writes everything
  # under here. Versioning is on as a cheap undo path for a bad
  # approve_prompt_diff write -- that tool has no undo of its own (see
  # approve.ts).
  PromptStoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TriageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - src/lambda.ts
    Properties:
      Handler: src/lambda.handler
      Runtime: nodejs24.x
      Timeout: 240
      MemorySize: 512
      # No ReservedConcurrentExecutions: this account's Lambda concurrency
      # limit in this region is only 10 (AWS default floor requires >=10
      # *unreserved* to remain account-wide), so reserving even 1 is
      # rejected at deploy time. Revisit (reserve concurrency, or a
      # lighter-weight overlap lock) once/if the account's concurrency
      # quota is raised.
      Environment:
        Variables:
          MODEL_PROVIDER: !Ref ModelProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MISTRAL_MODEL_ID: !Ref MistralModelId
          MISTRAL_API_KEY_PARAM: !Ref MistralApiKeyParam
          GREENPT_MODEL_ID: !Ref GreenptModelId
          GREENPT_API_KEY_PARAM: !Ref GreenptApiKeyParam
          TRIAGE_MAILBOX_ID: !Ref TriageMailboxId
          INBOX_MAILBOX_ID: !Ref InboxMailboxId
          INBOX_ORDERS_MAILBOX_ID: !Ref InboxOrdersMailboxId
          INBOX_NEWS_MAILBOX_ID: !Ref InboxNewsMailboxId
          ARCHIVE_NOISE_MAILBOX_ID: !Ref ArchiveNoiseMailboxId
          INBOX_SUSPICIOUS_MAILBOX_ID: !Ref InboxSuspiciousMailboxId
          LIMIT: !Ref Limit
          FASTMAIL_TOKEN_PARAM: !Ref FastmailTokenParam
          PUSHOVER_TOKEN_PARAM: !Ref PushoverTokenParam
          PUSHOVER_USER_PARAM: !Ref PushoverUserParam
          PROMPT_BUCKET: !Ref PromptStoreBucket
      Policies:
        - Statement:
            - Sid: ReadLivePrompt
              Effect: Allow
              Action: s3:GetObject
              # Cold-start fetch only touches current.json (getCurrentPrompt(),
              # see lambda.ts/current-prompt.ts) -- no history/* access needed
              # here, and no write access: this function only ever reads the
              # live pointer, never approves a version.
              Resource: !Sub "${PromptStoreBucket.Arn}/current.json"
            - Sid: InvokeBedrockClassifier
              Effect: Allow
              # classify.ts calls Bedrock's Converse API (model-agnostic,
              # not Anthropic-specific); Converse authorizes on the same
              # bedrock:InvokeModel action as InvokeModel itself. Granted
              # unconditionally (not gated on ModelProvider) -- IAM
              # permissions are static at deploy time, and this is what
              # keeps ModelProvider=bedrock a same-artifact rollback with no
              # redeploy-time IAM surprise.
              Action: bedrock:InvokeModel
              # BedrockModelId may be either a directly-invokable on-demand
              # model id (e.g. Qwen3 235B) or a cross-region inference
              # profile (e.g. eu.anthropic.claude-haiku-4-5-...). For a
              # profile, Bedrock checks IAM permission on *both* the
              # inference-profile ARN (this account/region) and the
              # underlying foundation-model ARN in whichever region the
              # profile routes to, which for an "eu."-prefixed profile can
              # be any EU region, not just where this stack is deployed --
              # so both resource lines stay regardless of which kind of id
              # BedrockModelId currently holds. Narrowed off "*" only
              # insofar as region/account go -- narrowing to the specific
              # model id itself is deferred, not currently a priority.
              Resource:
                - !Sub arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            - Sid: ReadTriageSecrets
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              # Param name Parameters (FastmailTokenParam etc.) already
              # include their leading "/" -- concatenated directly onto
              # "parameter" per the SSM ARN format, not "parameter/${name}".
              # MistralApiKeyParam included unconditionally, same reasoning
              # as InvokeBedrockClassifier above -- granting IAM read access
              # doesn't require the parameter to actually exist yet, so this
              # doesn't force out-of-band secret creation on a Bedrock-mode
              # deploy.
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FastmailTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PushoverTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PushoverUserParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MistralApiKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GreenptApiKeyParam}

  # Defined as raw CloudFormation, not SAM's `Events: Schedule:` shorthand
  # -- that shorthand's EventSource schema only allows Type/Properties, no
  # Condition key, so it can't be gated by ScheduleEnabled at all (see the
  # parameter's own description). A plain resource-level Condition is
  # universally supported, so the toggle lives here instead: when
  # ScheduleEnabled=false, neither this rule nor its invoke permission
  # exist in the stack.
  TriageSchedule:
    Type: AWS::Events::Rule
    Condition: ScheduleIsEnabled
    Properties:
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt TriageFunction.Arn
          Id: TriageFunctionScheduleTarget

  TriageScheduleInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: ScheduleIsEnabled
    Properties:
      FunctionName: !Ref TriageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TriageSchedule.Arn

  # jmap-triage-mcp: remote, publicly-reachable Streamable HTTP server (not
  # local stdio) exposing the 5 tools in src/mcp-server.ts (see
  # ARCHITECTURE.md). Runs as a plain Node http server rather than a
  # hand-rolled Streamable-HTTP-to-Lambda-event adapter -- the AWS Lambda
  # Web Adapter layer execs this process and proxies the Function URL's
  # streamed HTTP straight to it, so mcp-server.ts has zero Lambda-specific
  # code in it.
  McpServerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # NOT esbuild -- SAM's built-in Node esbuild builder's output is the
      # bundle alone, with nothing else copied into the package. The Lambda
      # Web Adapter's zip-package convention needs a run.sh startup script
      # sitting alongside that bundle (Handler: run.sh, below), so this
      # calls `make build-McpServerFunction` instead -- see the root
      # Makefile, which esbuild-bundles src/mcp-server.ts itself and then
      # copies src/mcp-server-run.sh in as run.sh. Verified against
      # awslabs/aws-lambda-web-adapter's fastmcp-zip example, which uses the
      # same Handler: run.sh / exec pattern for a zip (non-container)
      # deployment.
      BuildMethod: makefile
    Properties:
      # The adapter execs this directly (AWS_LAMBDA_EXEC_WRAPPER below
      # replaces Lambda's normal handler dispatch), and run.sh's own job is
      # to exec `node mcp-server.js` as the long-lived process the adapter
      # then proxies HTTP traffic to.
      Handler: run.sh
      Runtime: nodejs24.x
      # evaluate_candidate's replay (evaluate.ts) classifies open
      # corrections plus a counterweight sample via whichever provider
      # MODEL_PROVIDER selects, sequentially and paced (model-pacing.ts) --
      # a concurrent worker pool was tried and measured to buy zero net
      # speedup against this account's rate limits while causing occasional
      # outright call failures, see evaluate.ts's own comments. Claude
      # Desktop enforces a hard, non-configurable 4-minute (240s) timeout on
      # remote MCP tool calls, so a slow replay just looks like a hung tool
      # call to whoever's using it -- evaluate.ts's counterweight caps and
      # category scoping are the actual latency fix; this Timeout is a
      # generous server-side ceiling on top of that, not the binding
      # constraint (Lambda's own max is 900s; RESPONSE_STREAM invoke mode
      # supports the full range, unlike the 30s buffered-mode cap).
      Timeout: 600
      MemorySize: 512
      Layers:
        - !Ref LambdaWebAdapterLayerArn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          # Lowercase, adapter-specific value -- NOT the same casing as the
          # Function URL's own InvokeMode property below (RESPONSE_STREAM).
          # Verified against awslabs/aws-lambda-web-adapter's README (env
          # var table) rather than assumed.
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
          PROMPT_BUCKET: !Ref PromptStoreBucket
          MODEL_PROVIDER: !Ref ModelProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MISTRAL_MODEL_ID: !Ref MistralModelId
          MISTRAL_API_KEY_PARAM: !Ref MistralApiKeyParam
          GREENPT_MODEL_ID: !Ref GreenptModelId
          GREENPT_API_KEY_PARAM: !Ref GreenptApiKeyParam
          FASTMAIL_TOKEN_PARAM: !Ref FastmailTokenParam
          # MCP_BEARER_TOKEN_PARAM deliberately NOT set: Claude.ai's
          # custom-connector UI doesn't offer a static-bearer-token field on
          # this account, and OAuth wasn't built yet -- see mcp-server.ts's
          # isAuthorized()/bearerConfigured(). The SSM parameter and this
          # function's read permission on it (below) are left in place so
          # re-enabling later is a one-line env var addition + redeploy, not
          # a new IAM change. McpBearerTokenParam stays a template parameter
          # for that reason even though it's unused here right now.
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      Policies:
        - Statement:
            - Sid: ReadWritePromptStore
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              # Unlike TriageFunction's read-only current.json grant, this
              # is the one role allowed to write current.json and
              # history/* -- approve_prompt_diff (approve.ts) is the only
              # write path in the whole system, and it runs under this
              # function.
              Resource: !Sub "${PromptStoreBucket.Arn}/*"
            - Sid: ListPromptStore
              Effect: Allow
              Action: s3:ListBucket
              # Without this, S3 answers a GetObject on a key that doesn't
              # exist with 403 AccessDenied instead of 404 NoSuchKey (S3
              # won't confirm non-existence to a caller that can't list the
              # bucket) -- history.ts/approve.ts both treat a missing
              # history/index.json as "empty, not an error" by checking for
              # NoSuchKey specifically, which silently breaks without this
              # grant. Scoped to the bucket itself, not its
              # objects.
              Resource: !GetAtt PromptStoreBucket.Arn
            - Sid: InvokeBedrockClassifier
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            - Sid: ReadMcpSecrets
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              # MistralApiKeyParam included unconditionally, same reasoning
              # as TriageFunction's ReadTriageSecrets grant above -- needed
              # so evaluate.ts's requireModelConfig() (via
              # mcp-server.ts's ensureMistralApiKey()) can read it whenever
              # ModelProvider=mistral, without forcing this on a
              # Bedrock-mode deploy.
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FastmailTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${McpBearerTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MistralApiKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GreenptApiKeyParam}

Outputs:
  TriageFunctionArn:
    Value: !GetAtt TriageFunction.Arn
  PromptStoreBucketName:
    Value: !Ref PromptStoreBucket
  McpServerFunctionUrl:
    Description: >
      Streamable HTTP endpoint for the jmap-triage-mcp custom connector --
      append /mcp (e.g. https://<id>.lambda-url.<region>.on.aws/mcp).
    Value: !GetAtt McpServerFunctionUrl.FunctionUrl
